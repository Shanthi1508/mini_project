<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple Calculator with clean design, accurate arithmetic, keyboard shortcuts, and full history display">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
  <main class="calculator-app" role="region" aria-label="Simple Calculator">
    <header class="calculator-header">
      <div class="window-decorations">
        <span class="dot dot-red" aria-hidden="true"></span>
        <span class="dot dot-yellow" aria-hidden="true"></span>
        <span class="dot dot-green" aria-hidden="true"></span>
      </div>
      <h1 class="calculator-title">Calculator</h1>
    </header>

    <section class="calculator-screen" aria-label="Calculation display">
      <div id="history-display" class="history-display" aria-live="polite" aria-label="Operation history"></div>
      <div id="main-display" class="main-display" role="status" aria-live="assertive" aria-label="Current value">0</div>
    </section>

    <div class="calculator-keypad" role="group" aria-label="Calculator Keypad">
      <!-- Row 1: Actions -->
      <button type="button" class="btn btn-action" data-action="all-clear" aria-label="All clear">AC</button>
      <button type="button" class="btn btn-action" data-action="clear-entry" aria-label="Clear entry">CE</button>
      <button type="button" class="btn btn-action" data-action="percent" aria-label="Percent">%</button>
      <button type="button" class="btn btn-operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

      <!-- Row 2: 7, 8, 9, Multiply -->
      <button type="button" class="btn btn-digit" data-action="digit" data-value="7" aria-label="Seven">7</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="8" aria-label="Eight">8</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="9" aria-label="Nine">9</button>
      <button type="button" class="btn btn-operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

      <!-- Row 3: 4, 5, 6, Subtract -->
      <button type="button" class="btn btn-digit" data-action="digit" data-value="4" aria-label="Four">4</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="5" aria-label="Five">5</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="6" aria-label="Six">6</button>
      <button type="button" class="btn btn-operator" data-action="operator" data-value="-" aria-label="Minus">−</button>

      <!-- Row 4: 1, 2, 3, Add -->
      <button type="button" class="btn btn-digit" data-action="digit" data-value="1" aria-label="One">1</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="2" aria-label="Two">2</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="3" aria-label="Three">3</button>
      <button type="button" class="btn btn-operator" data-action="operator" data-value="+" aria-label="Plus">+</button>

      <!-- Row 5: Toggle Sign, 0, Decimal, Equals -->
      <button type="button" class="btn btn-digit" data-action="toggle-sign" aria-label="Plus minus">±</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="0" aria-label="Zero">0</button>
      <button type="button" class="btn btn-digit" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" class="btn btn-equals" data-action="calculate" aria-label="Equals">=</button>
    </div>

    <footer class="calculator-footer">
      <span class="shortcut-tip">Keyboard: numbers, +, -, *, /, Enter, Backspace, Esc</span>
    </footer>
  </main>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
